name: Cross-platform plugin validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml が同じ commit の 3OS matrix と実ブラウザ smoke を「公開前ゲート」
  # として呼ぶための入口。ここに job を二重定義せず、release 側は
  # `uses: ./.github/workflows/cross-platform.yml` で本ファイルを再利用する。
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci
      - name: Install python QA dependencies for attribute gates
        # 人物の同一性チェック（scripts/audit-koya-character-identity.py）は cv2・numpy・PIL を読む。
        # PIL が無いと下書き作成の23件が「Python実行環境を解決できない」で落ちる。
        # OpenCV 5 は Haar cascade（cv2.CascadeClassifier）を本体から外したので、
        # 顔検出を使う監査が全部落ちる（2026-09 に 5.0 が出て CI が拾った）。4 系に固定する。
        run: python -m pip install "opencv-python-headless<5" numpy pillow
      # 動画のレンダーと実MP4の監査は ffmpeg / ffprobe に、カット差し替えの監査は
      # 文字の混入を見る tesseract（jpn+eng）に乗っている。ランナーのイメージには
      # どちらも入っていない。入れないと数十件が落ち、許可できない skip も出る
      # （必須の道具の欠落は skip の許可リストに入れない決まり）。各 OS の
      # パッケージ管理で入れ、第三者の action は使わない（release の gate でも走るため）。
      # macOS と Windows の日本語データは、全言語で 686MB ある Homebrew の
      # tesseract-lang の代わりに、tessdata_fast 4.1.0 の1ファイルを SHA-256 で照合して置く。
      # fonts-noto-cjk は吹き出しの縦書きを描くための日本語フォント。ランナーのイメージには
      # 日本語フォントが無く、ブラウザーは字を豆腐（四角）で描く（下の描画器の検査が落とす）。
      - name: Install media and OCR tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-jpn fonts-noto-cjk
      # macOS は、setup が運営者の端末に入れるのと同じ固定版 ffmpeg（SHA-256 照合つき）を使う。
      # Homebrew の ffmpeg は freetype 無しでビルドされ、タイトルカードの drawtext を持たない
      # （2026-09-24、CI で落ちた）。必須の道具の欠けは skip の許可リストに入れない決まりなので、
      # 道具のほうを揃える。運営者と同じ ffmpeg で試験することにもなる。
      # 配布元が一時的に応答しないと公開前ゲートごと止まる（2026-09-25 に1回あった）。取得した
      # 固定版は GitHub のキャッシュに置く。キャッシュから戻しても、下の ensureManagedFfmpeg が
      # 記録した SHA-256 と実行ファイルの起動を確かめ直してから使う。
      - name: Cache the pinned ffmpeg (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/buzzassist-tools
          key: buzzassist-ffmpeg-9.0.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin_dir="$(node -e "import('./lib/prerequisiteTools.mjs').then(async (m) => { const r = await m.ensureManagedFfmpeg({ toolsDir: process.env.RUNNER_TEMP + '/buzzassist-tools' }); if (!r.ok) { console.error(r.detail); process.exit(1); } console.log(require('node:path').dirname(r.ffmpeg)); })")"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/ffmpeg" -hide_banner -filters | grep -q ' drawtext '
      - name: Install media and OCR tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install tesseract
          tessdata="$(brew --prefix)/share/tessdata"
          curl -fsSL -o "$tessdata/jpn.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/jpn.traineddata
          echo "1f5de9236d2e85f5fdf4b3c500f2d4926f8d9449f28f5394472d9e8d83b91b4d  $tessdata/jpn.traineddata" | shasum -a 256 -c -
      - name: Install media and OCR tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg tesseract -y --no-progress
          $dir = "C:\Program Files\Tesseract-OCR"
          $dest = Join-Path $dir "tessdata\jpn.traineddata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/jpn.traineddata" -OutFile $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "1f5de9236d2e85f5fdf4b3c500f2d4926f8d9449f28f5394472d9e8d83b91b4d") { throw "jpn.traineddata の SHA-256 が一致しない: $hash" }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Show media and OCR toolchain
        run: |
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          tesseract --version
          tesseract --list-langs
      # 縦組みの吹き出しは SVG をブラウザー（Chrome / Edge / Chromium）で PNG にして載せる。
      # 探索先が macOS の置き場所だけだった（2026-09-25 の外部レビュー）。ランナーには
      # Ubuntu・Windows・macOS とも Chrome が入っている（Windows は Edge も）。doctor の
      # svg-rasterizer と同じ関数で縦書きの小さな SVG を描いて読み返し、字が縦に並び
      # 豆腐でないことを確かめる。どのブラウザーを使ったかもログに残す。
      # 下の npm test でも test/svgRasterizer.test.mjs が同じことを確かめ、ブラウザーが
      # 無くて skip した場合は skip 許可リストに無いので落ちる。
      - name: Check the speech-bubble SVG rasterizer
        shell: bash
        run: node -e "import('./lib/svgRasterizer.mjs').then(async (m) => { const r = await m.probeSvgRasterizer(); console.log(JSON.stringify(r, null, 2)); if (!r.ok) process.exit(1); })"
      - name: Run tests including isolated Codex and Claude Code setup
        run: npm test -- --skip-policy config/ci-test-skip-allowlist.json
      # 公開面の検査。このリポジトリは PUBLIC なので、新しいファイルが1つ
      # 増えるたびに運営者名・キャスト名・開発機の絶対パスが紛れ込む余地が
      # できる。手で叩いたときしか働かない検査は実質無いのと同じなので、
      # 第三者が踏む線の上に載せる。
      # 既知の未解決は config/public-surface-allowlist.json に理由つきで
      # 記録されていて、一覧に無い検出が出たときだけ落ちる。
      - name: Audit public surface
        run: npm run public-surface

      # 正本スキル・両ホストのアダプター・在庫 manifest（SHA と版）の整合。
      # 正本を直して manifest を上げ忘れると、運営者の Job 作成が全部落ちる。
      # 端末側の plugin cache のずれは CI には無いので、doctor の host-skill-sync が見る。
      - name: Check skill inventory consistency
        run: npm run skills:check

      # CLAUDE.md / AGENTS.md / GEMINI.md は config/host-instructions.template.md から作る。
      # 手で1つだけ直すと、ほかのホストが古い規則のまま残る（3つを手で保守していた頃に起きた）。
      - name: Check host instruction files are generated from the template
        run: npm run instructions:check

      - name: Build canvas
        run: npm run build
      # 検査語彙は鍵つき digest で、鍵は secret でだけ渡す（公開 salt の旧形式は
      # 総当たりで名前が戻った）。鍵が無い実行（pull request・fork・secret 未設定）
      # では、その語を照合していないことを警告で残して先へ進む。Release は
      # 鍵が無ければ止まる（release.yml）。
      - name: Audit actual npm distribution tarball
        shell: bash
        env:
          BUZZASSIST_SENSITIVE_VOCABULARY_KEY: ${{ secrets.BUZZASSIST_SENSITIVE_VOCABULARY_KEY }}
        run: |
          if [ -n "$BUZZASSIST_SENSITIVE_VOCABULARY_KEY" ]; then
            npm run package:audit
          else
            echo "::warning title=検査語彙を照合していない::BUZZASSIST_SENSITIVE_VOCABULARY_KEY が無いので docs/learning/sensitive-vocabulary.digest.json の語を照合していない（未検査）。Release は鍵が無ければ止まる。"
            npm run package:audit -- --allow-missing-signals
          fi

  canvas-browser-smoke:
    name: Ubuntu / real-browser Canvas smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mount Canvas and exercise projected media in a real browser
        run: npm run test:e2e:canvas
